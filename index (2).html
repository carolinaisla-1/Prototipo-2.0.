<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruta de Bienvenida RetailMax</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fa;--card:#fff;--tx:#1b2430;--mu:#5d6b7e;--ac:#1F3864;--ac2:#fff;--ok:#2e9e6b;--bd:#dbe1ea;--warn:#fff2a8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151d;--card:#1a212c;--tx:#e8edf4;--mu:#9aa8ba;--ac:#7fa8e8;--ac2:#10151d;--ok:#4cc790;--bd:#2c3644;--warn:#4a4420}}
:root[data-theme="dark"]{--bg:#10151d;--card:#1a212c;--tx:#e8edf4;--mu:#9aa8ba;--ac:#7fa8e8;--ac2:#10151d;--ok:#4cc790;--bd:#2c3644;--warn:#4a4420}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Calibri,Carlito,system-ui,sans-serif}
.w{max-width:640px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:18px 0 8px}p{margin:6px 0}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.bar{height:12px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.pct{font-size:32px;font-weight:700;color:var(--ac)}
label.it{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd);min-height:44px}
label.it:last-child{border:0}
input[type=checkbox],input[type=radio]{width:22px;height:22px;flex:none;accent-color:var(--ok)}
.tag{font-size:12px;background:var(--bd);border-radius:10px;padding:2px 8px;margin-left:6px}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:var(--ac2);font-weight:700;min-height:44px;cursor:pointer}
button.s{background:transparent;color:var(--mu);border:1px solid var(--bd);font-weight:400}
select,textarea,input[type=text]{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.vid{background:#0e1520;color:#cfd8e6;border-radius:12px;padding:20px 14px;text-align:center;margin-top:10px}
.vid h3{color:#fff;margin:6px 0;font-size:20px;animation:fi .5s}.vid p{font-size:17px;min-height:78px;animation:fi .7s}.vid .bar{background:#2c3644}.vid small{color:#9aa8ba}
.em{font-size:60px;animation:pop .5s}.ctl{display:flex;gap:8px;justify-content:center;margin:8px 0}.ctl button{padding:8px 14px}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.q{margin:12px 0}.ok{color:var(--ok);font-weight:700}.bad{color:#c0392b;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border-radius:0;background:transparent;color:var(--mu);padding:14px 4px}
nav button.on{color:var(--ac);border-top:3px solid var(--ac)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd)}
.ex{background:var(--warn);font-size:12px;padding:1px 6px;border-radius:6px}
</style></head><body><div class="w" id="app"></div>
<nav id="nav"></nav>
<script>
var MODS=[
{id:'v1',t:'Cultura y políticas de RetailMax',d:'~1 min',s:'RetailMax opera tiendas en cinco países. Nuestros valores: servicio, respeto y trabajo en equipo. Debes cumplir tu horario, usar el uniforme y registrar tu asistencia cada día. (Contenido de ejemplo.)',q:[{p:'¿Cuántos países abarca la operación de RetailMax?',o:['Tres','Cinco','Diez'],a:1},{p:'¿Qué debes registrar cada día?',o:['Tu asistencia','Tus ventas','Tu almuerzo'],a:0}]},
{id:'v2',t:'Seguridad en tienda',d:'~1 min',s:'Mantén los pasillos despejados, usa los equipos de carga con cuidado y conoce las vías de evacuación. Ante un accidente, avisa de inmediato a tu jefatura. (Contenido de ejemplo.)',q:[{p:'¿Qué haces ante un accidente?',o:['Esperar al final del turno','Avisar de inmediato a tu jefatura','Resolverlo solo'],a:1},{p:'Los pasillos deben estar…',o:['Despejados','Con cajas apiladas','Cerrados'],a:0}]},
{id:'v3',t:'Atención al cliente',d:'~1 min',s:'Saluda dentro de los primeros segundos, escucha antes de ofrecer y, si no sabes algo, pide ayuda en vez de inventar la respuesta. (Contenido de ejemplo.)',q:[{p:'Si un cliente te pregunta algo y no sabes la respuesta, debes…',o:['Inventar una respuesta','Pedir ayuda a un compañero o jefatura','Ignorarlo'],a:1},{p:'Antes de ofrecer un producto, debes…',o:['Escuchar al cliente','Hablar de ofertas','Cobrar'],a:0}]},
{id:'v4',c:'Jefatura',t:'Gestión de tu equipo',d:'~1 min',s:'',q:[{p:'¿Qué debes revisar para planificar el trabajo de tu equipo?',o:['Turnos y asistencia','Solo las ventas','Nada'],a:0},{p:'La retroalimentación a tu equipo debe ser…',o:['Solo una vez al año','Clara, respetuosa y oportuna','Pública y con críticas'],a:1}]},
{id:'v5',c:'Operario/a',t:'Operación y uso de equipos',d:'~1 min',s:'',q:[{p:'¿Cuándo puedes usar un equipo de carga?',o:['Solo si te capacitaron','Siempre','Si no hay nadie mirando'],a:0},{p:'Si un equipo falla, debes…',o:['Seguir usándolo','Reportarlo y no usarlo','Repararlo tú solo'],a:1}]},
{id:'v6',t:'Tu primer día: qué esperar',d:'~1 min',s:'',q:[{p:'¿Con cuánta anticipación debes llegar a tu turno?',o:['10 minutos antes','Después del turno','A cualquier hora'],a:0},{p:'¿Qué te asignan los primeros días?',o:['Nada','Un mentor','Un reemplazo'],a:1}]},
{id:'v7',t:'Contrato, pagos y beneficios',d:'~1 min',s:'',q:[{p:'¿Dónde revisas tu cargo, jornada y fecha de inicio?',o:['En tu contrato','En el uniforme','En la caja'],a:0},{p:'¿A quién consultas por la fecha exacta de pago?',o:['A nadie','A un cliente','A RR.HH.'],a:2}]},
{id:'v8',c:'Cajero/a',t:'Sistema de caja',d:'~1 min',s:'',q:[{p:'Antes de entregar la boleta, debes…',o:['Confirmar el pago','Cobrar después','Omitir el pago'],a:0},{p:'Si te equivocas en un cobro, debes…',o:['Ignorarlo','Avisar a tu jefatura para anularlo','Devolver dinero sin avisar'],a:1}]}];
var SC={
v1:[{e:'🏬',h:'Bienvenida/o a RetailMax',b:'Somos una empresa de retail con tiendas en cinco países. En tu equipo, cada persona importa.'},{e:'💙',h:'Nuestros valores',b:'Servicio al cliente, respeto y trabajo en equipo guían todo lo que hacemos en la tienda.'},{e:'🕒',h:'Tu día a día',b:'Cumple tu horario, usa tu uniforme y registra tu asistencia cada día.'},{e:'🤝',h:'Cómo pedir ayuda',b:'Si tienes dudas, consulta a tu jefatura o a tu mentor. Preguntar es parte de aprender.'},{e:'✅',h:'Resumen',b:'Cinco países, tres valores y un compromiso: registrar tu asistencia cada día. Ahora responde el quiz.'}],
v2:[{e:'🦺',h:'Tu seguridad primero',b:'En la tienda, cuidarte a ti y a tus compañeros es lo más importante.'},{e:'🚧',h:'Pasillos despejados',b:'Mantén los pasillos libres de cajas y objetos para evitar caídas.'},{e:'🏗️',h:'Equipos de carga',b:'Usa los equipos de carga con cuidado y solo si te enseñaron a manejarlos.'},{e:'🚪',h:'Vías de evacuación',b:'Reconoce desde el primer día dónde están las salidas de emergencia.'},{e:'🚨',h:'Ante un accidente',b:'Avisa de inmediato a tu jefatura. No esperes al final del turno. Ahora responde el quiz.'}],
v3:[{e:'👋',h:'El primer saludo',b:'Saluda al cliente en los primeros segundos, con una sonrisa y mirándolo a los ojos.'},{e:'👂',h:'Escucha primero',b:'Antes de ofrecer un producto, escucha qué necesita el cliente.'},{e:'🙋',h:'Si no sabes, pide ayuda',b:'Si no conoces la respuesta, pide ayuda a un compañero o a tu jefatura. No inventes.'},{e:'😊',h:'Cierra con amabilidad',b:'Agradece, ofrece más ayuda y despídete con cordialidad.'},{e:'✅',h:'Resumen',b:'Saluda, escucha, pide ayuda cuando haga falta y cierra con amabilidad. Ahora responde el quiz.'}],
v4:[{e:'👥',h:'Tu rol como jefatura',b:'Lideras a un equipo de tienda y eres el vínculo entre tus trabajadores y RR.HH.'},{e:'🗓️',h:'Turnos y asistencia',b:'Planifica los turnos y revisa la asistencia cada día para que la tienda funcione sin problemas.'},{e:'💬',h:'Retroalimentación',b:'Da retroalimentación clara, respetuosa y a tiempo. No esperes a fin de año.'},{e:'📊',h:'Reportes de tienda',b:'Revisa los reportes de ventas y de incidentes y compártelos con RR.HH. cuando corresponda.'},{e:'✅',h:'Resumen',b:'Planifica turnos, da retroalimentación oportuna y usa los reportes. Ahora responde el quiz.'}],
v5:[{e:'🛠️',h:'Tus tareas operativas',b:'Tu trabajo mantiene la tienda en marcha: recepción, orden y preparación de mercadería.'},{e:'📦',h:'Orden y recepción',b:'Revisa la mercadería al recibirla y guárdala en su lugar, sin bloquear pasillos.'},{e:'🦺',h:'Equipos y protección',b:'Usa los equipos de carga solo si te capacitaron, y siempre con tu protección personal.'},{e:'🚨',h:'Reporta fallas',b:'Si un equipo falla, reporta a tu jefatura y no lo uses hasta que esté revisado.'},{e:'✅',h:'Resumen',b:'Orden, equipos solo con capacitación y reporte de fallas. Ahora responde el quiz.'}],
v6:[{e:'🎒',h:'Qué llevar',b:'Lleva tu cédula de identidad, tus documentos de ingreso y ropa cómoda.'},{e:'🕗',h:'Horario y llegada',b:'Llega 10 minutos antes de tu turno y pregunta por tu jefatura en la entrada.'},{e:'🧭',h:'Recorrido por la tienda',b:'Tu jefatura te mostrará la sala, la bodega, las salidas de emergencia y los casilleros.'},{e:'🤝',h:'Tu mentor',b:'Te asignarán un compañero que te acompañará durante tus primeros días.'},{e:'✅',h:'Resumen',b:'Llega temprano, lleva tus documentos y apóyate en tu mentor. Ahora responde el quiz.'}],
v7:[{e:'📝',h:'Tu contrato',b:'Revisa tu contrato digital: cargo, jornada y fecha de inicio.'},{e:'🕒',h:'Registro de asistencia',b:'Registra tu entrada y tu salida todos los días. Es parte de tus obligaciones.'},{e:'💵',h:'Cuándo se paga',b:'Consulta a RR.HH. la fecha exacta de pago, que figura en tu contrato.'},{e:'🎁',h:'Beneficios',b:'Pregunta por los beneficios de tu cargo, como descuentos en tienda o seguros.'},{e:'✅',h:'Resumen',b:'Contrato, asistencia, pago y beneficios: ante dudas, consulta a RR.HH. Ahora responde el quiz.'}],
v8:[{e:'💻',h:'Conoce tu caja',b:'Verás el lector de códigos, la pantalla y los medios de pago.'},{e:'🔍',h:'Registrar productos',b:'Escanea cada producto y revisa en pantalla el nombre y el precio.'},{e:'💳',h:'Medios de pago',b:'Acepta efectivo, tarjeta y transferencia, y confirma el pago antes de entregar la boleta.'},{e:'⚠️',h:'Errores y anulaciones',b:'Si te equivocas, no improvises: avisa a tu jefatura para anular el cobro.'},{e:'✅',h:'Resumen',b:'Escanea, confirma el pago y, ante un error, avisa. Ahora responde el quiz.'}]};
var PT=null,PI=0,PP=true,PN=false,PM=null;
function speak(t){try{speechSynthesis.cancel();if(!PN||!PP)return;var u=new SpeechSynthesisUtterance(t);u.lang='es-CL';speechSynthesis.speak(u)}catch(e){}}
function player(id){T0[id]=T0[id]||Date.now();clearTimeout(PT);PM=id;PI=0;PP=true;draw()}
function draw(){var sc=SC[PM],s=sc[PI],el=document.getElementById('pl');if(!el)return;
 el.innerHTML='<div class="vid"><div class="em">'+s.e+'</div><h3>'+s.h+'</h3><p>'+s.b+'</p><div class="bar"><i style="width:'+Math.round((PI+1)/sc.length*100)+'%"></i></div><div class="ctl"><button class="s" data-p="prev">⏮</button><button data-p="pp">'+(PP?'⏸':'▶')+'</button><button class="s" data-p="next">⏭</button><button class="s" data-p="snd">'+(PN?'🔊':'🔈')+'</button></div><small>Escena '+(PI+1)+' de '+sc.length+'</small></div>';
 clearTimeout(PT);speak(s.b);
 if(PP&&PI<sc.length-1)PT=setTimeout(function(){PI++;draw()},Math.max(7000,s.b.length*90));}
var ITEMS=[
{id:'c1',g:'Trámites (antes del primer día)',t:'Firmar contrato digital (simulado)'},
{id:'c2',g:'Trámites (antes del primer día)',t:'Subir documentos de ingreso (simulado)'},
{id:'v1',g:'Capacitación en video (antes del primer día)',m:'v1'},{id:'v2',g:'Capacitación en video (antes del primer día)',m:'v2'},{id:'v3',g:'Capacitación en video (antes del primer día)',m:'v3'},{id:'v4',g:'Capacitación en video (antes del primer día)',m:'v4',c:'Jefatura'},{id:'v5',g:'Capacitación en video (antes del primer día)',m:'v5',c:'Operario/a'},{id:'v6',g:'Capacitación en video (antes del primer día)',m:'v6'},{id:'v7',g:'Capacitación en video (antes del primer día)',m:'v7'},{id:'v8',g:'Capacitación en video (antes del primer día)',m:'v8',c:'Cajero/a'},
{id:'c3',g:'Primera semana',t:'Conocer a tu jefatura y a tu mentor'},
{id:'c4',g:'Primera semana',t:'Practicar caja y sistemas con tu jefatura'},
{id:'c5',g:'Primer mes',t:'Reunión de seguimiento con RR.HH.'}];
var SUM='',FORM_URL='',T0={},S={name:'',cargo:'',chk:{},quiz:{}},tab='inicio',openM=null,KEY='retailmax_pmv_v1';
try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function done(i){return i.m?!!(S.quiz[i.m]&&S.quiz[i.m].ok):!!S.chk[i.id]}
function itxt(i){var m={'Reponedor/a':'Practicar reposición y manejo de equipos de carga con tu jefatura','Vendedor/a de sala':'Practicar atención en sala y asesoría de productos con tu jefatura','Operario/a':'Practicar tus tareas operativas y el uso seguro de equipos con tu jefe/a directo/a','Jefatura':'Revisar con RR.HH. la gestión de tu equipo y los reportes de la tienda'};return i.id=='c4'&&m[S.cargo]?m[S.cargo]:i.t}
var LK=['Fue fácil encontrar lo que debía hacer','Los videos fueron claros y de duración adecuada','El checklist me ayudó a saber qué me faltaba','Me sentiría preparado/a para mi primer día','Recomendaría esta forma de inducción'];
function esc(x){return String(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function rad(E,k,t,o){var h='<div class="card"><b>'+t+'</b>';o.forEach(function(x){h+='<label class="it"><input type="radio" name="'+k+'" data-e="'+k+'" value="'+x+'"'+(E[k]==x?' checked':'')+'><span>'+x+'</span></label>'});return h+'</div>'}
function txt(E,k,t){return '<div class="card"><label class="mu">'+t+'</label><textarea rows="3" data-e="'+k+'">'+esc(E[k])+'</textarea></div>'}
function resumen(){var E=S.enc||{},p=prog(),tm=Object.keys(S.quiz).reduce(function(z,x){return z+(S.quiz[x].sec||0)},0),a=avg();var L=['ENCUESTA RUTA DE BIENVENIDA RETAILMAX','Nombre: '+(S.name||'-'),'Cargo: '+(S.cargo||'-'),'Avance: '+p.p+'%','Tiempo en videos: '+Math.floor(tm/60)+' min '+(tm%60)+' s','Quiz promedio: '+(a===null?'-':a+'%'),'Checklist sin ayuda: '+(E.t1||'-'),'Video y quiz sin ayuda: '+(E.t2||'-')];LK.forEach(function(q,i){L.push(q+': '+(E['lk'+i]||'-'))});L.push('Me habría ayudado el primer día: '+(E.ut||'-'),'Lo más útil: '+(E.g1||'-'),'Confuso o qué cambiar: '+(E.g2||'-'),'RR.HH./jefatura: '+(E.rr||'-'));return esc(L.join('\n'))}
function VI(){return ITEMS.filter(function(i){return !i.c||i.c==S.cargo})}
function prog(){var V=VI(),n=V.filter(done).length;return{n:n,t:V.length,p:Math.round(n/V.length*100)}}
function avg(){var k=Object.keys(S.quiz);if(!k.length)return null;return Math.round(k.reduce(function(a,x){return a+S.quiz[x].sc},0)/k.length)}
function mod(id){return MODS.filter(function(m){return m.id==id})[0]}
function view(){
 var h='',p=prog();
 if(tab=='inicio'){
  h+='<h1>Ruta de Bienvenida RetailMax</h1><p class="mu">Prototipo (PMV) · Tu preparación antes del primer día</p><div class="card"><b>Cómo funciona</b><p>1. Escribe tu nombre y elige tu cargo.<br>2. Haz los pasos de la lista.<br>3. En cada video toca <b>Ver video</b>, míralo y responde las 2 preguntas.<br>4. Cuando todo esté listo, toca <b>Marcar como completado</b>.</p></div>';
  h+='<div class="card"><label class="mu">Tu nombre</label><input type="text" id="nm" value="'+(S.name||'')+'" placeholder="Ej: Camila Pérez"><label class="mu" style="display:block;margin-top:10px">Tu cargo</label><select id="cg">'+['','Cajero/a','Reponedor/a','Vendedor/a de sala','Operario/a','Jefatura'].map(function(c){return '<option value="'+c+'"'+(S.cargo==c?' selected':'')+'>'+(c||'Selecciona tu cargo')+'</option>'}).join('')+'</select></div>';
  h+='<div class="card"><div class="pct">'+p.p+'%</div><div class="bar"><i style="width:'+p.p+'%"></i></div><p>'+(p.n==p.t?'¡Listo! Ya estás preparado/a para tu primer día.':'Llevas '+p.n+' de '+p.t+' pasos. Te faltan '+(p.t-p.n)+'.')+'</p></div>';
  if(p.n==p.t){h+=S.fin?'<div class="card" style="text-align:center"><div class="em">🎉</div><h2>¡Bienvenida/o a RetailMax'+(S.name?', '+esc(S.name):'')+'!</h2><p>Completaste todos tus pasos. Te esperamos en tu primer día.</p></div>':'<div class="card"><b>¡Terminaste todos los pasos!</b><p><button data-fin="1">Marcar como completado</button></p></div>'}
  var g='';
  VI().forEach(function(i){
   if(i.g!=g){if(g)h+='</div>';g=i.g;h+='<h2>'+g+'</h2><div class="card">'}
   var d=done(i);
   if(i.m){h+='<label class="it"><input type="checkbox" disabled '+(d?'checked':'')+'><span>Ver video y quiz: '+mod(i.m).t+' <span class="tag">'+(d?'completado':'<button data-go="'+i.m+'" style="padding:6px 12px;min-height:36px">Ver video</button>')+'</span></span></label>'}
   else h+='<label class="it"><input type="checkbox" data-c="'+i.id+'" '+(d?'checked':'')+'><span>'+itxt(i)+'</span></label>';
  });
  h+='</div><button class="s" id="rs">Reiniciar prueba</button> <button class="s" data-rh="1">Acceso RR.HH.</button>';
 }
 if(tab=='videos'){
  h+='<h1>Microvideos</h1><p class="mu">Cada video dura 2–3 minutos. Al final, responde 2 preguntas.</p>';
  MODS.filter(function(m){return !m.c||m.c==S.cargo}).forEach(function(m){
   var q=S.quiz[m.id],o=openM==m.id;
   h+='<div class="card"><b>'+m.t+'</b><span class="tag">'+m.d+'</span>'+(q&&q.ok?'<span class="tag ok">✓ '+q.sc+'%</span>':'');
   if(!o)h+='<p><button data-open="'+m.id+'">'+(q?'Ver de nuevo':'Ver')+'</button></p>';
   else{
    h+='<div id="pl"></div>';
    m.q.forEach(function(x,qi){h+='<div class="q"><b>'+(qi+1)+'. '+x.p+'</b>';x.o.forEach(function(op,oi){h+='<label class="it"><input type="radio" name="'+m.id+qi+'" value="'+oi+'"><span>'+op+'</span></label>'});h+='</div>'});
    h+='<button data-chk="'+m.id+'">Comprobar</button><p id="rs-'+m.id+'"></p>';
   }
   h+='</div>';
  });
 }
 if(tab=='panel'){
  var a=avg(),tm=Object.keys(S.quiz).reduce(function(z,x){return z+(S.quiz[x].sec||0)},0);
  h+='<button class="s" data-t="inicio">← Volver</button><h1>Panel de seguimiento RR.HH.</h1><p class="mu">Vista del equipo de RR.HH.: avance de cada persona que va a ingresar.</p><div class="card"><table><tr><th>Persona</th><th>Avance</th><th>Quiz</th><th>Pendiente</th></tr>';
  var pend=VI().filter(function(i){return !done(i)}).map(function(i){return itxt(i)||mod(i.m).t});
  h+='<tr><td>'+(S.name||'(sin nombre)')+(S.cargo?'<br><span class="mu">'+S.cargo+'</span>':'')+'</td><td>'+p.p+'%</td><td>'+(a===null?'—':a+'%')+'</td><td>'+(pend.length?pend.length+' pasos':'Ninguno')+'</td></tr>';
  h+='<tr><td>Persona A <span class="ex">ejemplo</span></td><td>100%</td><td>100%</td><td>Ninguno</td></tr><tr><td>Persona B <span class="ex">ejemplo</span></td><td>38%</td><td>50%</td><td>5 pasos</td></tr></table></div>';
  if(pend.length)h+='<div class="card"><b>Pendiente de '+(S.name||'la persona')+'</b><ul>'+pend.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul><p class="mu">Aquí RR.HH. enviaría un recordatorio automático.</p></div>';
  h+='<p class="mu">Tiempo en videos y quiz: '+Math.floor(tm/60)+' min '+(tm%60)+' s · Prototipo: los datos se guardan solo en este dispositivo.</p>';
 }
